<title>Guilds System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#15131c; --surface:#1e1a27; --surface2:#282232; --surface3:#332b40; --line:#3a3346;
  --text:#ece7f4; --muted:#9a90ad; --muted2:#786e8e;
  --rift:#3fe0a8; --rift-dim:rgba(63,224,168,.14);
  --gold:#dba63f; --gold-dim:rgba(219,166,63,.14);
  --crystal:#5fc7e8; --crystal-dim:rgba(95,199,232,.14);
  --token:#b98ee0; --token-dim:rgba(185,142,224,.14);
  --hazard:#e0654a; --hazard-dim:rgba(224,101,74,.14);
  --elite:#e0954a; --elite-dim:rgba(224,149,74,.14);
  --rankF:#8b8496; --rankE:#6fbf73; --rankD:#5fa8e8; --rankS:#f2c94c;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.45}
h1,h2,h3{font-family:'Cinzel',Georgia,serif;text-wrap:balance;margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--rift);outline-offset:2px}
::selection{background:var(--rift-dim)}

#app{max-width:1080px;margin:0 auto;padding:20px 20px 60px}

/* ---- header ---- */
.topbar{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--ink) 78%,transparent);padding:14px 20px 10px;margin:0 -20px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.crest{width:34px;height:38px;background:var(--surface2);border:1px solid var(--line);clip-path:polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%);display:flex;align-items:center;justify-content:center;font-family:'Cinzel';font-weight:700;color:var(--rift);flex:none}
.guildname{display:flex;align-items:center;gap:10px}
.guildname h1{font-size:1.15rem;letter-spacing:.02em}
.guildname .tag{color:var(--muted2);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em}
.resbar{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.82rem}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip b{font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:none;color:var(--muted);padding:9px 14px;font-size:.88rem;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-color:var(--rift)}
.subtabs{display:flex;gap:6px;margin-bottom:16px}
.subtab{background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:7px;font-size:.8rem}
.subtab.active{color:var(--rift);border-color:var(--rift)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--surface3);border:1px solid var(--line);padding:10px 16px;border-radius:9px;font-size:.85rem;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- generic ---- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:.78rem}
.btn{background:var(--surface3);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;font-size:.84rem;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--rift)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--rift);color:#0c1712;border-color:var(--rift);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--hazard);color:var(--hazard)}
.btn.ghost{background:none}
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--rift)}
.badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:.68rem;font-weight:700;color:#100e16}
.pip-row{display:flex;gap:4px;margin:6px 0}
.pip{width:14px;height:6px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.pip.on{background:var(--rift);border-color:var(--rift)}

/* ---- register ---- */
.register{max-width:460px;margin:14vh auto 0;text-align:center}
.register h1{font-size:1.8rem;margin-bottom:6px}
.register input{width:100%;margin-top:18px;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:9px;font-size:1rem;font-family:'Cinzel'}

/* ---- difficulty / hero cards ---- */
.diffcard{cursor:pointer;transition:.15s}
.diffcard:hover{border-color:var(--rift)}
.diffcard h3{font-size:1rem;color:var(--rift)}
.diffcard .rewards{display:flex;gap:10px;margin-top:8px;font-size:.76rem}

.herocard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2);position:relative}
.herocard.picked{outline:2px solid var(--rift)}
.herocard.down{opacity:.5}
.herocard .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.herocard .name{font-weight:600;font-size:.9rem}
.trait{font-size:.68rem;padding:2px 7px;border-radius:20px;display:inline-block;margin-top:4px}
.trait.pos{background:var(--rift-dim);color:var(--rift)}
.trait.neg{background:var(--hazard-dim);color:var(--hazard)}
.trait.neu{background:var(--surface3);color:var(--muted)}

/* ---- rift run ---- */
.pathrow{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:6px 2px 16px}
.node-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-weight:600;font-size:.78rem;flex:none;border:2px solid var(--line);background:var(--surface2);color:var(--muted)}
.node-ic.cur{border-color:var(--rift);color:var(--rift);box-shadow:0 0 0 4px var(--rift-dim)}
.node-ic.past{opacity:.4}
.node-ic.fork{border-style:dashed}
.node-link{width:18px;height:2px;background:var(--line);flex:none}

.combatants{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.monster{flex:1;min-width:200px}
.monster h3{color:var(--hazard)}
.party{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.mini-hero{display:flex;align-items:center;gap:8px;font-size:.8rem}
.mini-hero .bar{flex:1}

.log{background:#0e0c13;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-family:'IBM Plex Mono';font-size:.78rem;max-height:220px;overflow-y:auto;color:#c9c2d8}
.log div+div{margin-top:4px}

.shopitem{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2)}
.rtype{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2)}

.branch h3{font-size:.95rem;color:var(--rift);margin-bottom:2px}
.branch .sub{font-size:.74rem;color:var(--muted2);margin-bottom:10px}
.node{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--surface2)}
.node .nn{font-weight:600;font-size:.86rem}
.cap{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.cap .cn{color:var(--token);font-weight:600;font-size:.82rem}

.relicrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.relicrow:last-child{border-bottom:none}

/* ---- items: drag & drop ---- */
.itemslot{width:38px;height:38px;border:1px dashed var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface3)}
.itemslot.dragover{border-color:var(--rift);background:var(--rift-dim)}
.itemtile{width:100%;height:100%;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#100e16;cursor:grab}
.itemtile:active{cursor:grabbing}
.itembag{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:var(--surface3);min-height:56px}
.itembag.dragover{border-color:var(--rift);background:var(--rift-dim)}
.herorow{display:flex;align-items:center;gap:10px;padding:6px 0}
.herorow .name{flex:1;min-width:90px;font-size:.84rem;font-weight:600}

/* ---- skill tree ---- */
.skilltree{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.skirow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.skill{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface3)}
.skill.owned{border-color:var(--rift);background:var(--rift-dim)}
.skill.locked{opacity:.5}
.skill .sn{font-weight:600;font-size:.8rem;margin-bottom:2px}
.skill button{margin-top:6px}

@media(max-width:640px){.topbar{padding:14px 14px 10px;margin:0 -14px 14px}#app{padding:14px 14px 50px}}
</style>

<div id="app"></div>
<div class="toast" id="toast"></div>

   Ends only on retreat or a wipe — the long-term chase once the 3 fixed
   tiers are cleared. */
const ENDLESS_BASE={monsterHp:125,monsterDmg:14,coin:[85,140],crystal:[20,36],tokenBase:36,detectorChance:.22,recPower:280};
function endlessDiffForCycle(cycle){
  const mult=1+cycle*0.35;
  return{
    id:'endless',name:'Endless Rift',floors:6,power:'Extreme',
    monsterHp:Math.round(ENDLESS_BASE.monsterHp*mult),monsterDmg:Math.round(ENDLESS_BASE.monsterDmg*mult),
    coin:[Math.round(ENDLESS_BASE.coin[0]*mult),Math.round(ENDLESS_BASE.coin[1]*mult)],
    crystal:[Math.round(ENDLESS_BASE.crystal[0]*mult),Math.round(ENDLESS_BASE.crystal[1]*mult)],
    tokenBase:Math.round(ENDLESS_BASE.tokenBase*mult),detectorChance:ENDLESS_BASE.detectorChance,
    recPower:Math.round(ENDLESS_BASE.recPower*mult),
  };
}
function currentDiff(){return state.run.endless?endlessDiffForCycle(state.run.cycle||0):DIFFICULTIES.find(d=>d.id===state.run.diffId);}

/* Evolution: at max level, a hero can reforge into the next-rank class within
   its own role (crystals cost). Preserves accumulated level growth by scaling
   the ratio/rank-mult delta rather than resetting stats. */
function evolutionTarget(cls){
  const rankIdx=RANKS.findIndex(r=>r.id===cls.rank);
  for(let i=rankIdx+1;i<RANKS.length;i++){
    const next=CLASS_POOL.find(c=>c.role===cls.role&&c.rank===RANKS[i].id);
    if(next)return next;
  }
  return null;
}
function innateValueFor(cls,rankIdx){return cls.kind==='boss_alpha_strike'?1:Math.round(CHAMP_KIND_BASE[cls.kind]*(1+rankIdx*.18)*1000)/1000;}
/* Recruited heroes also earn a full skill tree on top of this innate, so their
   copy rolls at a fraction of a Champion's — full strength stays a Champion-only perk. */
const HERO_INNATE_MULT=.6;
function heroInnateValue(cls,rankIdx){return Math.round(innateValueFor(cls,rankIdx)*HERO_INNATE_MULT*1000)/1000;}
function generateChampion(){
  const rankId=weightedRank();
  const rank=RANKS.find(r=>r.id===rankId);
  const rankIdx=RANKS.findIndex(rk=>rk.id===rankId);
  const pool=CLASS_POOL.filter(c=>c.rank===rankId);
  const cls=pick(pool);
  const champ={
    id:'champ'+(state.nextId++),name:cls.name,isChampion:true,rank:rankId,type:cls.type,
    innateKind:cls.kind,innateValue:innateValueFor(cls,rankIdx),flavor:cls.flavor,
    level:1,xp:0,skillPoints:0,skills:{},trait:null,downedUntil:0,
    baseHp:Math.round(30*cls.hpRatio*rank.mult),baseDmg:Math.round(8*cls.dmgRatio*rank.mult),
  };
  champ.hp=maxHp(champ);
  return champ;
}
function ensureChampion(){
  if(!state.currentChampion)state.currentChampion=generateChampion();
  const c=state.currentChampion;c.hp=maxHp(c);c.downedUntil=0;
  return c;
}

function heroSkillTotal(h,kind){

  if(h.skills){const tree=CLASS_SKILLS[h.clsId]||[];tree.forEach(n=>{if(n.kind===kind&&h.skills[n.id])s+=n.value;});}
  if(h.innateKind===kind)s+=h.innateValue||0;
  s+=heroItemTotal(h,kind);
  return s;
}

function affinityBonus(party){

}
function xpToNext(level){return 40+(level-1)*25;}
function gainXp(h,amount){
  h.xp=(h.xp||0)+amount;
  while((h.level||1)<10&&h.xp>=xpToNext(h.level||1)){
    h.xp-=xpToNext(h.level||1);
    h.level=(h.level||1)+1;
    h.baseHp=Math.round(h.baseHp*1.08);h.baseDmg=Math.round(h.baseDmg*1.08);
    h.skillPoints=(h.skillPoints||0)+1;
  }
}
function describeSkill(n){

    case'hp_pct':return`+${Math.round(n.value*100)}% HP`;
    case'first_round_pct':return`+${Math.round(n.value*100)}% first-strike damage`;
    case'escalate_pct':return`+${Math.round(n.value*100)}% damage per round (stacking)`;
    case'mend_pct':return`Mends ${Math.round(n.value*100)}% of the party's HP pool each round`;
    case'hazard_guard_pct':return`-${Math.round(n.value*100)}% hazard severity`;
    case'dodge_pct':return`${Math.round(n.value*100)}% chance to block a retaliation`;
    case'wipe_guard':return`Once per rift, survive a wipe at ${Math.round(n.value*100)}% HP`;

  }
}

function weightedRarity(){const total=RARITIES.reduce((s,r)=>s+r.weight,0);let r=rand(total);for(const rar of RARITIES){if(r<rar.weight)return rar.id;r-=rar.weight;}return'common';}
function weightedRank(){const total=RANKS.reduce((s,r)=>s+r.weight,0);let r=rand(total);for(const rk of RANKS){if(r<rk.weight)return rk.id;r-=rk.weight;}return'F';}
function pickTraitName(){const r=Math.random();if(r<.28)return pick(NEG_TRAITS);if(r<.62)return pick(POS_TRAITS);return null;}
function genHero(rankId,levelHint){
  const rank=RANKS.find(r=>r.id===rankId)||RANKS.find(r=>r.id===weightedRank());
  const rankIdx=RANKS.findIndex(rk=>rk.id===rank.id);
  const cls=pick(CLASS_POOL.filter(c=>c.rank===rank.id));
  const roleCls=CLASSES.find(c=>c.id===cls.role);
  const trait=pickTraitName();
  const s=1+0.08*(levelHint-1);
  const baseHp=Math.round(roleCls.baseHp*cls.hpRatio*rank.mult*s);
  const baseDmg=Math.round(roleCls.baseDmg*cls.dmgRatio*rank.mult*s);
  const hero={
    id:'h'+(state.nextId++),name:`${pick(FIRST_NAMES)} the ${cls.name}`,
    clsId:cls.role,poolId:cls.id,type:cls.type,flavor:cls.flavor,rank:rank.id,
    innateKind:cls.kind,innateValue:heroInnateValue(cls,rankIdx),
    level:levelHint,xp:0,skillPoints:0,skills:{},baseHp,baseDmg,trait,downedUntil:0,
  };

  const hasSpecial=Math.random()<.4;
  const relic={name:`${type} ${noun}`,type,rarity:rarity.id,dmg:Math.round((hasSpecial?2:3)*rarity.mult),hp:Math.round((hasSpecial?6:9)*rarity.mult)};
  if(hasSpecial){
    const s=pick(RELIC_SPECIALS);
    relic.special={kind:s.kind,value:Math.round(s.value*rarity.mult*1000)/1000,label:s.label};
  }

function genMonster(diff,floorIdx,kind){
  const scale=1+floorIdx*0.12;
  const hpMult=kind==='boss'?1.8:(kind==='elite'?1.45:1);
  const dmgMult=kind==='boss'?1.5:(kind==='elite'?1.3:1);
  const hp=Math.round(diff.monsterHp*scale*hpMult);
  const dmg=Math.round(diff.monsterDmg*scale*dmgMult);
  const name=kind==='boss'?`${pick(BOSS_NAMES)}, ${diff.name.split(' ')[0]} Warden`:(kind==='elite'?pick(ELITE_NAMES):pick(MONSTER_NAMES));
  return{name,hp,dmg};

function recruitHero(offerId){
  const idx=state.recruitPool.findIndex(h=>h.id===offerId);if(idx<0)return;
  if(state.heroes.length>=heroSlotCap())return flash('Roster is full — upgrade Roster Expansion');
  const offer=state.recruitPool[idx];const rank=RANKS.find(r=>r.id===offer.rank);
  if(state.resources.coins<rank.cost)return flash('Not enough Coins');
  state.resources.coins-=rank.cost;
  const isDupe=state.heroes.some(h=>h.poolId===offer.poolId);
  const hero={...offer};
  if(guildMentor()){hero.level=2;hero.skillPoints=(hero.skillPoints||0)+1;hero.baseHp=Math.round(hero.baseHp*1.08);hero.baseDmg=Math.round(hero.baseDmg*1.08);}
  hero.hp=maxHp(hero);hero.downedUntil=0;
  state.heroes.push(hero);
  state.recruitPool[idx]=genRecruitOffer();

    const refund=Math.round(rank.cost*.5);
    state.resources.coins+=refund;
    flash(`Already had a ${hero.name.split(' the ')[1]} — refunded ${refund}c.`);
  }
  save();render();
}
function upgradeNode(bId,nId){
  const key=`${bId}.${nId}`;const node=findNode(bId,nId);const cur=lvl(key);
  if(cur>=node.max)return;

  state.resources.crystals-=cost;state.upgrades[key]=cur+1;save();render();

function buyCap(bId,nId){

function evolveHero(heroId){
  const h=state.heroes.find(x=>x.id===heroId);if(!h)return;
  if((h.level||1)<10)return flash('Must be Level 10 to evolve');
  const curCls=CLASS_POOL.find(c=>c.id===h.poolId);if(!curCls)return flash('This hero predates the evolution system');
  const next=evolutionTarget(curCls);
  if(!next)return flash('Already at the top of this path');
  const nextRank=RANKS.find(r=>r.id===next.rank);
  if(state.resources.crystals<nextRank.cost)return flash('Not enough Crystals');
  const curRank=RANKS.find(r=>r.id===curCls.rank);
  state.resources.crystals-=nextRank.cost;
  const ratioMult=(next.hpRatio/curCls.hpRatio)*(nextRank.mult/curRank.mult);
  const dmgRatioMult=(next.dmgRatio/curCls.dmgRatio)*(nextRank.mult/curRank.mult);
  h.baseHp=Math.round(h.baseHp*ratioMult);
  h.baseDmg=Math.round(h.baseDmg*dmgRatioMult);
  h.poolId=next.id;h.rank=next.rank;h.type=next.type;h.flavor=next.flavor;
  h.innateKind=next.kind;
  const rankIdx=RANKS.findIndex(r=>r.id===next.rank);
  h.innateValue=heroInnateValue(next,rankIdx);
  h.name=`${h.name.split(' the ')[0]} the ${next.name}`;
  h.hp=maxHp(h);
  flash(`${h.name} evolved into a Rank ${next.rank} ${CLASSES.find(c=>c.id===next.role).name}!`);
  save();render();
}

function openAssembly(diffId){

  ui.pendingChampion=ensureChampion();

function pickRelicOption(idx){ui.pendingRelicChoiceIdx=ui.pendingRelicChoiceIdx===idx?null:idx;render();}
function buildLayers(diff){
  const layers=[{options:['combat']}];
  const midCount=diff.floors-2;
  const pool=['combat','combat','shop','hazard','elite'];
  for(let i=0;i<midCount;i++){
    let a=pick(pool),b=pick(pool),guard=0;
    while(b===a&&guard<6){b=pick(pool);guard++;}
    if(b===a)b=pick(pool.filter(x=>x!==a));
    layers.push({options:[a,b]});
  }
  if(midCount>0&&!layers.some(l=>l.options.includes('elite'))){
    const li=1+rand(midCount);layers[li].options[rand(2)]='elite';
  }
  layers.push({options:['boss']});
  return layers;
}
function autoResolveSingleOption(){
  if(!state.run)return;
  const layer=state.run.layers[state.run.pos];
  if(layer&&layer.options.length===1&&state.run.chosen[state.run.pos]===undefined){
    state.run.chosen[state.run.pos]=layer.options[0];
  }
}
function chooseNode(type){
  if(state.run.chosen[state.run.pos]!==undefined)return;
  state.run.chosen[state.run.pos]=type;state.run.nodeState=null;state.run.hazardType=undefined;save();render();
}
function enterRift(){
  const endless=ui.pendingDiff==='endless';
  const diff=endless?endlessDiffForCycle(0):DIFFICULTIES.find(d=>d.id===ui.pendingDiff);
  const layers=buildLayers(diff);
  let shield=equippedRelics().reduce((s,r)=>s+r.hp,0);
  if(ui.pendingRelicChoiceIdx!=null){
    const chosen=ui.pendingRelicOptions[ui.pendingRelicChoiceIdx];
    shield+=chosen.hp;
    state.relics.push({id:'rl'+(state.nextId++),name:chosen.name,type:chosen.type,rarity:chosen.rarity,dmg:chosen.dmg,hp:chosen.hp,special:chosen.special,equipped:false});
  }
  state.run={diffId:ui.pendingDiff,endless,cycle:0,layers,pos:0,chosen:[],heroIds:[...ui.pendingHeroIds],champion:ui.pendingChampion,shield,anchorUsed:false,nodeState:null,sealed:null,hardcore:ui.pendingHardcore};
  autoResolveSingleOption();
  ui.pendingDiff=null;ui.pendingHeroIds=[];ui.pendingRelicOptions=[];ui.pendingRelicChoiceIdx=null;ui.pendingChampion=null;ui.selectedAbility=null;ui.pendingHardcore=false;
  save();render();
}
function currentParty(){
  const roster=state.run.heroIds.map(id=>state.heroes.find(h=>h.id===id)).filter(Boolean);
  return state.run.champion?[state.run.champion,...roster]:roster;

function ensureBossPreview(){
  if(!state.run.bossPreview){
    const diff=currentDiff();
    const monster=genMonster(diff,state.run.pos,'boss');
    const mechanic=pick(BOSS_MECHANICS);
    if(mechanic.id==='frenzied')monster.dmg=Math.round(monster.dmg*1.25);
    state.run.bossPreview={monster,mechanic};
  }
}
function engageCombat(kind){
  const isBoss=kind==='boss';
  const diff=currentDiff();
  const party=currentParty().filter(h=>!isDowned(h)&&h.hp>0);
  if(party.length===0){flash('Every assigned hero is downed!');return;}
  const abilityUsed=ui.selectedAbility;ui.selectedAbility=null;
  if(abilityUsed==='cleric')party.forEach(h=>{h.hp=maxHp(h);});
  let monster,mechanic=null;
  if(isBoss){
    ensureBossPreview();
    monster=state.run.bossPreview.monster;mechanic=state.run.bossPreview.mechanic;
  }else{
    monster=genMonster(diff,state.run.pos,kind);
  }
  const monsterDmg=abilityUsed==='ranger'?Math.round(monster.dmg*.6):monster.dmg;
  const rawSum=party.reduce((s,h)=>s+dmgOf(h),0);
  let teamDmgBase=(rawSum*tacticalBonus()+relicDmgBonus())*(1+synergyValueFor('dmg_pct')+affinityBonus(party));
  if(abilityUsed==='warrior')teamDmgBase*=1.3;
  const vanguard=hasCap('ops.drill');
  const firstRoundBonus=(vanguard?0.25:0)+partySkillTotal(party,'first_round_pct')+relicSpecialTotal('first_round_pct')+synergyValueFor('first_round_pct')+(abilityUsed==='rogue'?0.9:0);
  const escalate=partySkillTotal(party,'escalate_pct')+relicSpecialTotal('escalate_pct')+synergyValueFor('escalate_pct');
  const mend=Math.min(.4,partySkillTotal(party,'mend_pct')+relicSpecialTotal('mend_pct')+synergyValueFor('mend_pct'));
  const dodge=Math.min(.6,partySkillTotal(party,'dodge_pct')+relicSpecialTotal('dodge_pct')+synergyValueFor('dodge_pct'));
  const wipeGuard=Math.min(.9,partySkillTotal(party,'wipe_guard')+relicSpecialTotal('wipe_guard'));
  const alphaStrikes=isBoss?partySkillTotal(party,'boss_alpha_strike')+relicSpecialTotal('boss_alpha_strike'):0;
  let mHp=monster.hp,shield=state.run.shield||0;
  const totalMaxAtStart=party.reduce((s,h)=>s+maxHp(h),0)||1;
  let hpPool=party.reduce((s,h)=>s+h.hp,0);
  const log=[`A ${monster.name} blocks the way (${fmt(monster.hp)} HP).`];
  if(mechanic)log.push(`${mechanic.name}: ${mechanic.desc}`);
  if(abilityUsed)log.push(`${ABILITIES[abilityUsed].name} activated!`);
  if(alphaStrikes>0){
    const alpha=teamDmgBase*alphaStrikes;
    mHp-=alpha;
    log.push(`Cataclysm unleashes an opening volley for ${fmt(alpha)}!`);
  }
  if(abilityUsed==='mage'){
    const burst=teamDmgBase;
    mHp-=burst;
    log.push(`Overcharge unleashes a burst for ${fmt(burst)}!`);
  }
  let round=0,wipeGuardUsed=false;
  while(mHp>0&&hpPool>0&&round<30){
    round++;
    const mult=(round===1?1+firstRoundBonus:1)*(1+escalate*(round-1));
    const dealt=teamDmgBase*mult;
    mHp-=dealt;
    log.push(`Round ${round} — the Guild strikes for ${fmt(dealt)}.`);
    if(mHp<=0){log.push(`The ${monster.name} falls!`);break;}
    if(mechanic&&mechanic.id==='regen'){
      const heal=Math.round(monster.hp*.08);
      mHp=Math.min(monster.hp,mHp+heal);
      log.push(`${monster.name} regenerates ${fmt(heal)} HP.`);
    }
    if(mend>0){
      const heal=Math.round(hpPool*mend);
      if(heal>0){hpPool=Math.min(totalMaxAtStart,hpPool+heal);log.push(`The party mends ${fmt(heal)} HP.`);}
    }
    let back=monsterDmg;
    if(mechanic&&mechanic.id==='enrage'&&round>4)back=Math.round(back*(1+0.15*(round-4)));
    const warded=mechanic&&mechanic.id==='warded'&&round<=2;
    if(!warded&&dodge>0&&Math.random()<dodge){
      log.push(`The party evades the ${monster.name}'s retaliation!`);back=0;
    }
    if(!warded&&shield>0&&back>0){const abs=Math.min(shield,back);shield-=abs;back-=abs;if(abs>0)log.push(`Relic wards absorb ${fmt(abs)} damage.`);}
    if(back>0){
      hpPool=Math.max(0,hpPool-back);
      log.push(`The ${monster.name} hits back for ${fmt(back)}.`);
      if(hpPool<=0&&!wipeGuardUsed&&wipeGuard>0){
        wipeGuardUsed=true;hpPool=Math.max(1,Math.round(totalMaxAtStart*wipeGuard));
        log.push(`Last Stand! The party clings to life with ${fmt(hpPool)} HP.`);
      }
    }
  }
  const won=mHp<=0;
  state.run.shield=shield;
  if(!won){
    if(state.run.hardcore){
      party.forEach(h=>{state.heroes=state.heroes.filter(x=>x.id!==h.id);});
      log.push('Your party is overwhelmed... and lost for good.');
    }else{
      party.forEach(h=>{h.hp=0;h.downedUntil=Date.now()+recoveryMs();});
      log.push('Your party is overwhelmed...');
    }
  }else{
    party.forEach(h=>{const share=maxHp(h)/totalMaxAtStart;h.hp=Math.max(1,Math.min(maxHp(h),Math.round(hpPool*share)));});
  }
  let coin=0,crystal=0,bonusCrystal=0,rewardOptions=null;
  if(won){
    const rewardMult=(kind==='elite'?1.4:1)*(state.run.hardcore?1.5:1);
    const depthMult=1+state.run.pos*0.05;
    coin=Math.round(rangeRand(diff.coin)*rewardMult*depthMult);
    crystal=Math.round(rangeRand(diff.crystal)*crystalYieldBonus()*rewardMult*depthMult);
    state.resources.coins+=coin;state.resources.crystals+=crystal;
    log.push(`Loot secured: +${coin} Coins, +${crystal} Crystals.`);
    if(kind==='elite'){
      party.forEach(()=>{if(Math.random()<energyExtractChance())bonusCrystal+=rand(4)+2;});
      if(bonusCrystal>0){state.resources.crystals+=bonusCrystal;log.push(`Elite spoils: +${bonusCrystal} bonus Crystals.`);}
    }
    const xpGain=isBoss?30:(kind==='elite'?20:12);
    party.forEach(h=>gainXp(h,xpGain));
    log.push(`+${xpGain} XP to each hero in the fight.`);
    if(!isBoss)rewardOptions=[genLoot(weightedRarity()),genLoot(weightedRarity())];
  }
  state.run.nodeState={type:'combat',log,won,kind,rounds:round,revealedCount:0,resolving:true,rewardOptions,rewardChosen:false,monsterName:monster.name};
  save();render();
  startReveal();
}
function startReveal(){
  clearInterval(revealTimer);
  revealTimer=setInterval(()=>{
    if(!state||!state.run||!state.run.nodeState||!state.run.nodeState.resolving){clearInterval(revealTimer);return;}
    const ns=state.run.nodeState;
    const step=ns.log.length>20?2:1;
    ns.revealedCount=Math.min(ns.log.length,(ns.revealedCount||0)+step);
    if(ns.revealedCount>=ns.log.length){
      ns.resolving=false;ns.resolved=true;
      if(ns.kind==='boss'&&ns.won)state.run.bossRounds=ns.rounds;
      clearInterval(revealTimer);
    }
    save();render();
  },140);
}
function ensureHazardPreview(){if(!state.run.hazardType)state.run.hazardType=pick(HAZARD_TYPES);}
function pushThroughHazard(){
  const diff=currentDiff();
  const party=currentParty().filter(h=>!isDowned(h)&&h.hp>0);
  ensureHazardPreview();
  const hz=state.run.hazardType;
  const log=[];let dmg=(6+diff.floors*2)*hz.dmgMult;
  if(!state.run.anchorUsed&&anchorArtifact()){
    state.run.anchorUsed=true;log.push('The Anchor Artifact snuffs the hazard before it strikes.');dmg=0;
  }else{
    const guard=Math.min(.9,hazardSeverityReduction()+partySkillTotal(party,'hazard_guard_pct')+relicSpecialTotal('hazard_guard_pct')+synergyValueFor('hazard_guard_pct'));
    dmg=Math.round(dmg*(1-guard));
    let shield=state.run.shield||0;const abs=Math.min(shield,dmg);shield-=abs;dmg-=abs;state.run.shield=shield;
    if(abs>0)log.push(`Relic wards absorb ${fmt(abs)} of the hazard.`);
    if(dmg>0){
      const per=dmg/Math.max(1,party.length);
      party.forEach(h=>{h.hp=Math.max(0,Math.round(h.hp-per));if(h.hp<=0)h.downedUntil=Date.now()+recoveryMs();});
      log.push(`The hazard deals ${fmt(dmg)} damage across the party.`);
    }
  }
  if(Math.random()<hz.bonusChance){
    const c=rand(5)+2;
    if(hz.bonusType==='coins'){state.resources.coins+=c;log.push(`You scavenge ${c} stray Coins.`);}
    else{state.resources.crystals+=c;log.push(`Stray Crystals found in the rubble: +${c}.`);}
  }
  state.run.nodeState={type:'hazard',resolved:true,log};
  save();render();
}
function ensureShopOffers(){
  if(state.run.nodeState&&state.run.nodeState.type==='shop')return;
  const boosted=!!state.pendingShopBoost;
  const offers=[0,1,2].map((_,i)=>{
    const rarity=(boosted&&i===0)?'epic':weightedRarity();
    const loot=(boosted&&i===0)?{...genRelic(rarity),lootType:'relic'}:genLoot(rarity);
    const priceBase=10+15*RARITIES.find(x=>x.id===rarity).mult;
    loot.price=Math.max(4,Math.round(priceBase*(1-merchantPriceReduction())));
    return loot;
  });
  if(boosted){state.pendingShopBoost=false;flash('Shop Boost consumed — an Epic Relic is guaranteed here.');}
  state.run.nodeState={type:'shop',offers};
}
function buyShopOffer(idx){
  const off=state.run.nodeState.offers[idx];if(!off||off.bought)return;
  if(state.resources.coins<off.price)return flash('Not enough Coins');
  state.resources.coins-=off.price;off.bought=true;
  if(off.lootType==='item'){
    state.items.push({id:'it'+(state.nextId++),name:off.name,slot:off.slot,rarity:off.rarity,kind:off.kind,value:off.value,equippedTo:null});
  }else{
    state.relics.push({id:'rl'+(state.nextId++),name:off.name,type:off.type,rarity:off.rarity,dmg:off.dmg,hp:off.hp,special:off.special,equipped:equippedRelics().length<relicSlotCap()});
  }
  save();render();
}
function pickCombatReward(idx){
  const ns=state.run.nodeState;if(!ns||!ns.rewardOptions)return;
  const r=ns.rewardOptions[idx];if(!r)return;
  if(r.lootType==='item'){
    state.items.push({id:'it'+(state.nextId++),name:r.name,slot:r.slot,rarity:r.rarity,kind:r.kind,value:r.value,equippedTo:null});
  }else{
    state.relics.push({id:'rl'+(state.nextId++),name:r.name,type:r.type,rarity:r.rarity,dmg:r.dmg,hp:r.hp,special:r.special,equipped:equippedRelics().length<relicSlotCap()});
  }
  ns.rewardChosen=true;flash(`${r.name} added to the vault.`);save();render();
}
function skipCombatReward(){
  const ns=state.run.nodeState;if(!ns)return;
  ns.rewardChosen=true;save();render();
}
function advanceNode(){state.run.pos++;state.run.nodeState=null;state.run.hazardType=undefined;autoResolveSingleOption();save();render();}
function sealRift(){
  const diff=currentDiff();
  const fastClear=(state.run.bossRounds||99)<=6;
  const tokens=Math.round(diff.tokenBase*(fastClear?sealTokenBonus():1)*(state.run.hardcore?1.5:1));
  let gotDetector=false;
  if(Math.random()<diff.detectorChance+detectorDropBonus()){
    state.detectors.push({id:'d'+(state.nextId++),tier:state.run.endless?'ascendant':diff.id});gotDetector=true;
  }
  state.resources.tokens+=tokens;
  state.sealedCount++;state.triageUsedThisCycle=false;
  refreshRecruitPool();
  state.currentChampion=generateChampion();
  if(state.run.endless){
    const newCycle=(state.run.cycle||0)+1;
    if(newCycle>(state.bestEndlessCycle||0))state.bestEndlessCycle=newCycle;
    state.run.cycle=newCycle;
    const extra=buildLayers(endlessDiffForCycle(newCycle));
    state.run.layers=state.run.layers.concat(extra);
    state.run.pos=state.run.layers.length-extra.length;
    state.run.nodeState=null;state.run.bossRounds=undefined;state.run.bossPreview=undefined;state.run.hazardType=undefined;
    autoResolveSingleOption();
    state.run.sealed={tokens,fastClear,gotDetector,continuing:true,cycle:newCycle};
    save();render();
    return;
  }
  state.run.sealed={tokens,fastClear,gotDetector};
  save();render();
}
function continueEndless(){state.run.sealed=null;save();render();}
function retreatNow(){
  if(!ui.confirmRetreat){ui.confirmRetreat=true;render();setTimeout(()=>{ui.confirmRetreat=false;render();},3000);return;}
  ui.confirmRetreat=false;
  state.run=null;ui.showRunInventory=false;flash('Retreated — loot kept, no Seal Tokens earned.');save();render();
}
function finishRun(){state.run=null;ui.showRunInventory=false;save();render();}

    if(wounded.length)out+=`<div class="small" style="color:var(--hazard);margin-top:6px">Warning: ${wounded.join(', ')} ${wounded.length>1?'are':'is'} badly wounded.</div>`;

function timeLeft(ts){
  const ms=ts-Date.now();if(ms<=0)return'ready';
  const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}m ${s%60}s`;
}

function heroCardInner(h,cls){
  const isChamp=!!h.isChampion;
  const rankColor=RANK_COLOR[h.rank];
  const traitClass=NEG_TRAITS.includes(h.trait)?'neg':(POS_TRAITS.includes(h.trait)?'pos':'neu');
  const pct=Math.round(100*h.hp/maxHp(h));
  const innateLine=h.innateKind?`<div class="small" style="color:${rankColor};margin-top:2px">${describeSkill({kind:h.innateKind,value:h.innateValue})}</div>`:'';
  return `<div class="row">
      <div class="badge" style="background:${cls.color}">${cls.badge}</div>
      <div><div class="name">${h.name}</div><div class="small" style="color:${rankColor}">Rank ${h.rank} · Lv${h.level}</div></div>
    </div>
    <div class="bar"><i style="width:${pct}%;background:${pct<35?'var(--hazard)':'var(--rift)'}"></i></div>
    <div class="small mono muted" style="margin-top:4px">${h.hp}/${maxHp(h)} HP · ${dmgOf(h)} DMG</div>
    ${innateLine}
    ${isChamp
      ?`<p class="small muted" style="margin:4px 0 0;font-style:italic">${h.flavor}</p>`
      :`<div class="small mono muted" style="margin-top:2px">${(h.level||1)>=10?'MAX LEVEL':`XP ${h.xp||0}/${xpToNext(h.level||1)}`}${(h.skillPoints||0)>0?` · <span style="color:var(--rift)">${h.skillPoints} SP</span>`:''}</div><span class="trait ${traitClass}">${h.trait||'Steadfast'}</span>`}`;
}

const BUILD_KINDS=['dmg_pct','hp_pct','first_round_pct','escalate_pct','mend_pct','hazard_guard_pct','dodge_pct','wipe_guard','boss_alpha_strike'];
function renderBuildSummary(h){
  const trait=TRAIT_TABLE[h.trait]||{};
  const lines=BUILD_KINDS.map(k=>{
    let v=heroSkillTotal(h,k);
    if(k==='dmg_pct')v+=trait.dmg||0;
    if(k==='hp_pct')v+=trait.hp||0;
    return{k,v};
  }).filter(x=>x.v>0);
  if(!lines.length)return'';
  return `<div class="small muted" style="margin-bottom:10px;padding:8px;border:1px solid var(--border);border-radius:6px">
    <b style="color:var(--rift)">Build Summary</b> (trait + skills + innate)<br>
    ${lines.map(x=>describeSkill({kind:x.k,value:x.v})).join(' · ')}
  </div>`;
}
function renderSkillTree(h){
  const tree=CLASS_SKILLS[h.clsId]||[];
  const tiers={1:[],2:[],3:[]};
  tree.forEach(n=>tiers[n.tier].push(n));
  const anySkill=h.skills&&Object.values(h.skills).some(Boolean);
  let out=`<div class="skilltree">
    ${renderBuildSummary(h)}
    <div class="small muted" style="margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span>Skill Points available: <b class="mono" style="color:var(--rift)">${h.skillPoints||0}</b></span>
      ${anySkill?`<button class="btn ghost small" onclick="respecHero('${h.id}')">Respec (50c)</button>`:''}
    </div>`;
  [1,2,3].forEach(t=>{
    out+=`<div class="skirow">`;
    tiers[t].forEach(n=>{
      const owned=!!(h.skills&&h.skills[n.id]);
      const prereqOk=!n.requires.length||n.requires.every(r=>h.skills&&h.skills[r]);
      const levelOk=(h.level||1)>=n.reqLevel;
      const locked=!owned&&(!prereqOk||!levelOk);
      const canAfford=(h.skillPoints||0)>=n.cost;
      let status;
      if(owned)status='Learned';
      else if(!levelOk)status=`Requires Level ${n.reqLevel}`;
      else if(!prereqOk)status='Requires prior skill(s)';
      else status=`Cost ${n.cost} SP`;
      out+=`<div class="skill ${owned?'owned':''} ${locked?'locked':''}">
        <div class="sn">${n.name}</div>
        <div class="small muted">${describeSkill(n)}</div>
        <div class="small muted">${status}</div>
        ${!owned&&!locked?`<button class="btn" ${canAfford?'':'disabled'} onclick="learnSkill('${h.id}','${n.id}')">Learn</button>`:''}
      </div>`;
    });
    out+=`</div>`;
  });
  out+=`</div>`;
  return out;
}

function renderRun(){
  const run=state.run;
  const diff=currentDiff();
  let out=`<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2 style="font-size:1.05rem">${diff.name}${run.endless?` · Cycle ${(run.cycle||0)+1}`:''}${run.hardcore?' <span style="color:var(--hazard);font-size:.7em;letter-spacing:.08em">☠ HARDCORE</span>':''}</h2>
      <div class="small mono muted">Shield ${fmt(run.shield||0)}</div>
    </div>
    <div class="pathrow">`;
  run.layers.forEach((layer,i)=>{
    const chosenType=run.chosen[i];
    const single=layer.options.length===1;
    let label,color,extra='';
    if(chosenType){
      label=NODE_ICON[chosenType];color=NODE_COLOR[chosenType];
    }else if(i===run.pos){
      label='?';color='var(--muted2)';extra='fork';
    }else if(single){
      label=NODE_ICON[layer.options[0]];color=NODE_COLOR[layer.options[0]];
    }else if(cartographyUnlocked()){
      label=layer.options.map(o=>NODE_ICON[o]).join('');color='var(--muted2)';
    }else{
      label='?';color='var(--muted)';
    }
    out+=`<div class="node-ic ${i===run.pos?'cur':''} ${i<run.pos?'past':''} ${extra}" style="font-size:${label.length>1?'.6rem':'.78rem'};border-color:${color};color:${color}">${label}</div>`;
    if(i<run.layers.length-1)out+=`<div class="node-link"></div>`;
  });
  out+=`</div>`;
  out+=`<div style="margin-bottom:12px">
    <button class="btn ghost" onclick="toggleRunInventory()">${ui.showRunInventory?'Hide':'🎒'} Inventory &amp; Loadout</button>
    ${ui.showRunInventory?renderRunInventory():''}
  </div>`;

  if(run.sealed){
    if(run.sealed.continuing){
      out+=`<div style="display:flex;gap:14px;align-items:center">
        <img src="${CHEST_ICON}" style="width:56px;height:56px;image-rendering:pixelated;flex:none" alt="">
        <div>
          <h3 style="color:var(--rift)">Floor Sealed — Cycle ${run.sealed.cycle}</h3>
          <p class="small">+${fmt(run.sealed.tokens)} Rift Seal Tokens${run.sealed.fastClear?' (fast-clear bonus)':''}.${run.sealed.gotDetector?' A Rift Detector dropped.':''} The rift deepens...</p>
        </div>
      </div>
        <div style="display:flex;gap:10px;margin-top:10px">
          <button class="btn primary" onclick="continueEndless()">Descend Further</button>
          <button class="btn ghost" onclick="finishRun()">Bank Progress &amp; Leave</button>
        </div>`;
    }else{
      out+=`<div style="display:flex;gap:14px;align-items:center">
        <img src="${CHEST_ICON}" style="width:56px;height:56px;image-rendering:pixelated;flex:none" alt="">
        <div>
          <h3 style="color:var(--rift)">Rift Sealed!</h3>
          <p class="small">+${fmt(run.sealed.tokens)} Rift Seal Tokens${run.sealed.fastClear?' (fast-clear bonus applied)':''}.${run.sealed.gotDetector?' A Rift Detector dropped — sell it at the Auction.':''}</p>
        </div>
      </div>
        <button class="btn primary" style="margin-top:10px" onclick="finishRun()">Return to the Guild</button>`;
    }
  }else{
    const curType=run.chosen[run.pos];
    if(!curType){
      out+=renderChoicePanel(run.layers[run.pos].options);
    }else if(curType==='combat'||curType==='elite'||curType==='boss'){
      out+=renderCombatPanel(curType);
    }else if(curType==='shop'){
      out+=renderShopPanel();
    }else{
      out+=renderHazardPanel();
    }
    out+=`<div style="margin-top:14px"><button class="btn ${ui.confirmRetreat?'danger':'danger ghost'}" onclick="retreatNow()">${ui.confirmRetreat?'Click again to confirm Retreat':'Retreat'}</button></div>`;
  }
  out+=`</div>`;

function renderCombatPanel(kind){
  const isBoss=kind==='boss',isElite=kind==='elite';
  const run=state.run;const party=currentParty();
  const ns=run.nodeState;
  const title=isBoss?'Rift Boss':(isElite?'Elite Encounter':'Rift Encounter');
  const sub=isBoss?'Seal the floor by defeating this Warden.':(isElite?'A tougher foe guards richer spoils.':'Clear the room to press deeper.');
  const engageLabel=isBoss?'Engage the Warden':(isElite?'Engage the Elite':'Engage');
  let out=`<div class="combatants">
    <div class="party"><h3 style="font-size:.85rem;color:var(--muted)">Your Party</h3>`;
  party.forEach(h=>{
    const pct=Math.round(100*h.hp/maxHp(h));
    out+=`<div class="mini-hero"><span class="mono small">${h.name.split(' ')[0]}</span><div class="bar"><i style="width:${pct}%;background:${h.hp<=0?'var(--hazard)':'var(--rift)'}"></i></div><span class="mono small">${h.hp}/${maxHp(h)}</span></div>`;
  });
  out+=`</div><div class="monster"><h3 style="color:${isElite?'var(--elite)':'var(--hazard)'}">${title}</h3>
    <p class="small muted">${sub}</p></div>
  </div>`;
  if(isBoss&&!ns){
    ensureBossPreview();
    const bp=run.bossPreview;
    out+=`<div class="panel" style="margin-bottom:12px;background:var(--surface2);display:flex;gap:12px;align-items:center">
      <img src="${spriteForMonster(bp.monster.name)}" style="width:56px;height:56px;image-rendering:pixelated;flex:none" alt="">
      <div>
        <div style="font-weight:600">${bp.monster.name}</div>
        <div class="small mono muted">${fmt(bp.monster.hp)} HP · ${fmt(bp.monster.dmg)} DMG</div>
        <div class="small" style="color:var(--elite);margin-top:6px">${bp.mechanic.name} — ${bp.mechanic.desc}</div>
      </div>
    </div>`;
  }
  if(!ns){
    const alive=party.filter(h=>!isDowned(h)&&h.hp>0);
    const avail=availableAbilities(alive);
    if(avail.length){
      out+=`<div class="small muted" style="margin-bottom:6px">Party Ability (one use, this fight only):</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        ${avail.map(r=>`<button class="btn ${ui.selectedAbility===r?'primary':''}" onclick="selectAbility('${r}')">${ABILITIES[r].name}</button>`).join('')}
      </div>`;
      if(ui.selectedAbility&&avail.includes(ui.selectedAbility)){
        out+=`<p class="small muted" style="margin-bottom:10px">${ABILITIES[ui.selectedAbility].desc}</p>`;
        if(ui.selectedAbility==='cleric'&&alive.every(h=>h.hp>=maxHp(h)))out+=`<p class="small" style="color:var(--gold);margin-top:-6px;margin-bottom:10px">The party is already at full health — Blessing would do nothing this fight.</p>`;
      }
    }
    out+=`<button class="btn primary" onclick="engageCombat('${kind}')">${engageLabel}</button>`;
  }else{
    const shown=ns.resolving?(ns.revealedCount||0):ns.log.length;
    if(ns.monsterName)out+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><img src="${spriteForMonster(ns.monsterName)}" style="width:40px;height:40px;image-rendering:pixelated" alt=""><span class="small muted">${ns.monsterName}</span></div>`;
    out+=`<div class="log">${ns.log.slice(0,shown).map(l=>`<div>${l}</div>`).join('')}</div>`;
    if(ns.resolving)out+=`<div class="small muted" style="margin-top:8px">Resolving…</div>`;
    else if(ns.won&&ns.kind==='boss')out+=`<div style="margin-top:12px"><button class="btn primary" onclick="sealRift()">Seal the Rift</button></div>`;
    else if(ns.won&&ns.rewardOptions&&!ns.rewardChosen)out+=renderRewardChoice(ns.rewardOptions);
    else if(ns.won)out+=`<div style="margin-top:12px"><button class="btn primary" onclick="advanceNode()">Continue</button></div>`;
    else out+=`<div style="margin-top:12px"><button class="btn danger" onclick="finishRun()">Return to the Guild</button></div>`;
  }
  return out;
}

      <div class="badge" style="background:${rarity.color};padding:3px">${ITEM_SLOT_ICON[it.slot]?`<img src="${ITEM_SLOT_ICON[it.slot]}" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated">`:ITEM_SLOT_LABEL[it.slot][0]}</div>
      <div style="flex:1;min-width:140px"><div style="font-weight:600;font-size:.86rem">${it.name}</div><div class="small muted">${ITEM_SLOT_LABEL[it.slot]} · ${rarity.name} · ${itemDesc(it)}</div></div>

  return out;

function renderManagement(){
  const tier=guildTierInfo();
  let out=`<div class="panel" style="margin-bottom:16px">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <span style="color:var(--rift);font-weight:700;font-family:'Cinzel'">${tier.name}</span>

      const key=`${b.id}.${n.id}`;const cur=lvl(key);const maxed=cur>=n.max;const capOwned=hasCap(key);
      out+=`<div class="node">
        <div class="nn">${n.name}</div>

      if(!maxed){
        const cost=n.costBase+n.costStep*cur;
        out+=`<div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center">
          <span class="mono small" style="color:var(--crystal)">${cost}◆</span>
          <button class="btn" onclick="upgradeNode('${b.id}','${n.id}')">Upgrade</button></div>`;
      }else if(n.cap){
        out+=`<div class="cap"><div class="cn">${n.cap.name}${capOwned?' ✓':''}</div><div class="small muted">${n.cap.desc}</div>`;
        if(!capOwned)out+=`<div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center">
          <span class="mono small" style="color:var(--crystal)">${n.cap.cost}◆</span>

        out+=`</div>`;
      }else{

      }

  out+=`</div><div style="margin-top:16px"><button class="btn ${ui.confirmReset?'danger':'ghost'}" onclick="resetGuild()">${ui.confirmReset?'Click again to confirm reset':'Reset Guild'}</button></div>`;

  <div class="grid g4" style="margin-top:14px">`;
  let heroes=[...state.heroes];
  if(ui.rosterFilter&&ui.rosterFilter!=='all')heroes=heroes.filter(h=>h.clsId===ui.rosterFilter);
  if(ui.rosterSort==='level')heroes.sort((a,b)=>(b.level||1)-(a.level||1));
  else if(ui.rosterSort==='power')heroes.sort((a,b)=>powerOf(b)-powerOf(a));
  else if(ui.rosterSort==='class')heroes.sort((a,b)=>a.clsId.localeCompare(b.clsId));
  else heroes.sort((a,b)=>a.name.localeCompare(b.name));
  heroes.forEach(h=>{
    const cls=CLASSES.find(c=>c.id===h.clsId);const down=isDowned(h);
    const expanded=ui.expandedHeroId===h.id;
    const poolCls=CLASS_POOL.find(c=>c.id===h.poolId);
    const canEvolve=(h.level||1)>=10&&poolCls&&evolutionTarget(poolCls);
    const confirmingDismiss=ui.confirmDismiss===h.id;
    out+=`<div class="herocard ${down?'down':''}" style="border-color:${RANK_COLOR[h.rank]}">${heroCardInner(h,cls)}
      <div class="small mono muted" style="margin-top:2px">Power ${powerOf(h)}</div>
      <div style="margin-top:6px">${renderHeroItemSlots(h)}</div>
      ${down?`<div class="small" style="color:var(--hazard);margin-top:6px">Recovering: ${timeLeft(h.downedUntil)}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        ${NEG_TRAITS.includes(h.trait)&&lvl('ops.trait')>0?`<button class="btn ghost small" onclick="scrubTrait('${h.id}')">Scrub Trait (30c)</button>`:''}
        <button class="btn ghost small" onclick="rerollTrait('${h.id}')">Reroll Trait (60c)</button>
        ${canEvolve?`<button class="btn ghost small" style="color:var(--rift)" onclick="evolveHero('${h.id}')">Evolve (${RANKS.find(r=>r.id===evolutionTarget(poolCls).rank).cost} crystals)</button>`:''}
        <button class="btn ghost small" onclick="toggleHeroSkills('${h.id}')">${expanded?'Hide Skills':`Skills${(h.skillPoints||0)>0?` (${h.skillPoints})`:''}`}</button>
        <button class="btn ghost small" style="color:${confirmingDismiss?'var(--hazard)':'inherit'}" onclick="dismissHero('${h.id}')">${confirmingDismiss?'Confirm Dismiss?':'Dismiss'}</button>
      </div>
      ${expanded?renderSkillTree(h):''}
    </div>`;
  });
  out+=`</div>`;
  return out;
}

function selfCheck(){
  const errors=[];
  if(CLASS_POOL.length!==50)errors.push(`CLASS_POOL has ${CLASS_POOL.length} entries, expected 50`);
  const ids=CLASS_POOL.map(c=>c.id);
  const dupes=[...new Set(ids.filter((id,i)=>ids.indexOf(id)!==i))];
  if(dupes.length)errors.push(`Duplicate CLASS_POOL ids: ${dupes.join(', ')}`);
  CLASS_POOL.forEach(c=>{
    if(!CLASSES.find(x=>x.id===c.role))errors.push(`${c.id} has unknown role "${c.role}"`);
    if(!CLASS_SKILLS[c.role])errors.push(`${c.id}'s role "${c.role}" has no CLASS_SKILLS tree`);
    if(!CHAMP_KIND_BASE[c.kind])errors.push(`${c.id} has unknown kind "${c.kind}"`);
    if(!RANKS.find(r=>r.id===c.rank))errors.push(`${c.id} has unknown rank "${c.rank}"`);
    if(!RELIC_TYPES.includes(c.type))errors.push(`${c.id} has unknown type "${c.type}"`);
  });
  RELIC_SPECIALS.forEach(s=>{if(!BUILD_KINDS.includes(s.kind))errors.push(`RELIC_SPECIALS has unknown kind "${s.kind}"`);});
  Object.entries(SYNERGY_BONUS).forEach(([type,s])=>{
    if(!RELIC_TYPES.includes(type))errors.push(`SYNERGY_BONUS has unknown type "${type}"`);
    if(!BUILD_KINDS.includes(s.kind))errors.push(`SYNERGY_BONUS.${type} has unknown kind "${s.kind}"`);
  });
  ITEM_KIND_POOL.forEach(k=>{if(!BUILD_KINDS.includes(k))errors.push(`ITEM_KIND_POOL has unknown kind "${k}"`);if(!(k in ITEM_KIND_BASE))errors.push(`ITEM_KIND_BASE missing base value for "${k}"`);});
  if(RANKS.length!==7)errors.push(`RANKS has ${RANKS.length} entries, expected 7`);
  if(Object.keys(CLASS_SKILLS).length!==CLASSES.length)errors.push('CLASS_SKILLS role count does not match CLASSES');
  if(errors.length){
    console.error('Guilds System self-check failed:',errors);
    const banner=document.createElement('div');
    banner.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#4a1414;color:#ffb4a8;font:12px monospace;padding:10px;z-index:999;max-height:30vh;overflow:auto;white-space:pre-wrap';
    banner.textContent='Self-check failed:\n'+errors.join('\n');
    document.body.appendChild(banner);
  }
  return errors;
}
selfCheck();
load();render();
</script>
